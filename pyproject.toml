[project]
name = "agentsmith"
version = "0.1.0"
description = "A progressive, executable learning path for LangChain, LangGraph, and LangSmith"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.2",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.6.2",
    "langchain-text-splitters>=1.1.0",
    "langgraph>=1.2.11",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
